# BIS source config — every URL below was verified live via search/fetch on 2026-08-27.
# Organized by the problem statement's required capability, not by BIS's own site structure,
# so it's easy to see what feeds which feature of the assistant.
#
# NOTES ON SCRAPABILITY:
#   - "html_page" sources go through scrape_html_page(), which auto-splits FAQ pages into
#     Q&A pairs (verified working against the real bis.gov.in FAQ markup — see phase1 tests).
#   - Sources marked [JS-RENDERED] are single-page apps; plain requests+BeautifulSoup will
#     return an empty shell. Use browser devtools to find the underlying JSON API and hit
#     that directly instead — don't point the scraper at these URLs as-is.
#   - manakonline.in and crsbis.in are separate portals BIS operates alongside bis.gov.in —
#     don't assume everything lives under one domain.

