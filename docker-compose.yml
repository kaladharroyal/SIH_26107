version: '3.8'

# ==============================================================================
# Bureau of Indian Standards (BIS) AI Assistant — Docker Compose (Root)
# ==============================================================================

services:
  bis-rag-app:
    build:
      context: ./bis_RAG_system
      dockerfile: Dockerfile
    image: bis-rag-assistant:latest
    container_name: bis_rag_assistant
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ./bis_RAG_system/.env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-bis_chunks_bge_m3_v1}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.45}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - DEMO_MIN_RESPONSE_SECONDS=${DEMO_MIN_RESPONSE_SECONDS:-0.0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
